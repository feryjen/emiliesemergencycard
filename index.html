<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f6f1eb" />
  <title>Emilie's Kleine Oppepper 🤍</title>
  <style>
:root{
  --bg:#d8ddca;          /* helles Moos */
  --card:#f5f0e4;        /* warmes Pilz-Creme */
  --text:#146146;        /* tiefes Waldgrün */
  --muted:#69735e;       /* gedämpftes Moosgrün */
  --border:#a7ad91;      /* Flechte */
  --accent:#9b4938;      /* Fliegenpilz / Rostrot */
  --button:#e7e2d3;      /* heller Waldboden */
  --shadow:0 10px 30px rgba(49,67,51,.14);
}

    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      background:var(--bg);
      color:var(--text);
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      padding:20px;
    }

    .wrap{
      width:min(100%, 520px);
    }

    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:28px;
      padding:28px 22px;
      box-shadow:var(--shadow);
    }

    h1{
      margin:0 0 8px;
      font-size:clamp(2rem,7vw,3rem);
      line-height:1.05;
      letter-spacing:-.03em;
    }

    .intro{
      margin:0 0 24px;
      color:var(--muted);
      line-height:1.5;
    }

    .buttons{
      display:grid;
      gap:12px;
    }

button{
  width:100%;
  border:1px solid var(--border);
  background:var(--button);
  color:var(--text);
  border-radius:18px;
  padding:16px 18px;
  text-align:left;
  font:inherit;
  font-weight:700;
  cursor:pointer;
  transition:.15s ease;
  box-shadow:0 4px 12px rgba(49,67,51,.08);
}

button:hover{
  border-color:var(--accent);
  transform:translateY(-1px);
}

    button:active{
      transform:scale(.985);
    }

    button.secondary{
      text-align:center;
      font-weight:650;
      background:transparent;
      box-shadow:none;
    }

.result{
  margin-top:20px;
  padding:22px 18px;
  border:1px dashed var(--accent);
  border-radius:20px;
  background:var(--button);
  min-height:150px;
  display:none;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-size:1.2rem;
  line-height:1.55;
  white-space:pre-line;
}

    .result.show{
      display:flex;
    }

    .again{
      margin-top:12px;
      display:none;
    }

    .again.show{
      display:block;
    }

    .tiny{
      margin-top:18px;
      text-align:center;
      color:var(--muted);
      font-size:.88rem;
    }

.forest-floor{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:85px;
  background:
    radial-gradient(ellipse at bottom, #596447 0%, #596447 35%, transparent 36%);
  pointer-events:none;
  z-index:0;
}

.card{
  position:relative;
  z-index:2;
}

/* PILZE */

.mushroom{
  position:absolute;
  bottom:14px;
  width:40px;
  height:55px;
}

.mushroom-stem{
  position:absolute;
  bottom:0;
  left:14px;
  width:13px;
  height:32px;
  background:#e8dcc2;
  border-radius:6px 6px 4px 4px;
}

.mushroom-cap{
  position:absolute;
  top:5px;
  left:3px;
  width:35px;
  height:20px;
  background:#9b4938;
  border-radius:50% 50% 35% 35%;
  z-index:2;
}

/* kleine Punkte */

.mushroom-cap::before{
  content:"";
  position:absolute;
  width:4px;
  height:4px;
  border-radius:50%;
  background:#f5f0e4;
  top:6px;
  left:9px;
  box-shadow:
    12px -2px #f5f0e4,
    18px 7px #f5f0e4;
}

/* verschiedene Positionen */

.mushroom-1{
  left:8%;
  transform:scale(.65);
}

.mushroom-2{
  left:25%;
  transform:scale(1);
}

.mushroom-3{
  right:23%;
  transform:scale(.55);
}

.mushroom-4{
  right:7%;
  transform:scale(.8);
}

/* GRÄSER */

.grass{
  position:absolute;
  bottom:8px;
  width:3px;
  height:28px;
  background:#425137;
  border-radius:100% 0;
  transform-origin:bottom;
}

.g1{
  left:17%;
  transform:rotate(-18deg);
}

.g2{
  left:43%;
  transform:rotate(14deg);
}

.g3{
  right:34%;
  transform:rotate(-12deg);
}

.g4{
  right:15%;
  transform:rotate(20deg);
}

.g5{
  right:5%;
  transform:rotate(10deg);
}
.grass-field{
  position:absolute;
  inset:0;
  pointer-events:none;
}

.grass-blade{
  position:absolute;
  bottom:8px;
  width:2px;
  background:#425137;
  border-radius:100% 0;
  transform-origin:bottom;
  opacity:.9;
}
    
  </style>

      const grassField = document.getElementById("grassField");

const mushroomZones = [
  { from: 4, to: 13 },
  { from: 20, to: 31 },
  { from: 72, to: 80 },
  { from: 89, to: 98 }
];

function isMushroomZone(x){
  return mushroomZones.some(zone => x >= zone.from && x <= zone.to);
}

for(let i = 0; i < 100; i++){
  let x;

  do {
    x = Math.random() * 100;
  } while(isMushroomZone(x));

  const blade = document.createElement("div");
  blade.className = "grass-blade";

  const height = 10 + Math.random() * 28;
  const rotation = -25 + Math.random() * 50;

  blade.style.left = `${x}%`;
  blade.style.height = `${height}px`;
  blade.style.transform = `rotate(${rotation}deg)`;

  grassField.appendChild(blade);
}

    let lastCategory = null;
    let lastIndex = {};

    function randomVideo() {
      const video = videos[Math.floor(Math.random() * videos.length)];

    }

function randomHasselhoff() {
  const links = content.hasselhoff;
  const hasselhoff = links[Math.floor(Math.random() * links.length)];
  window.open(hasselhoff, "_blank");
}
    
    function pick(category){
      lastCategory = category;
      const items = content[category];

      let index;
      if(items.length === 1){
        index = 0;
      } else {
        do {
          index = Math.floor(Math.random() * items.length);
        } while(index === lastIndex[category]);
      }

      lastIndex[category] = index;

      const result = document.getElementById("result");
      result.textContent = items[index];
      result.classList.add("show");

      document.getElementById("again").classList.add("show");

      result.scrollIntoView({behavior:"smooth", block:"center"});
    }
